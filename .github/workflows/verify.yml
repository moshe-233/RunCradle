name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.0', '1.27.1']
    env:
      GOTOOLCHAIN: local
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
          cache: false
      - name: Check supported host and exact Go
        run: |
          test "$(id -u)" -ne 0
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          test "$(go env GOVERSION)" = 'go${{ matrix.go }}'
          go version
      - name: Prepare fixed official engine
        run: make prepare
      - name: Prepare pinned browser test tools (development only)
        run: make prepare-web-test
      - name: Verify definitions, shared runs and browser workflows
        run: make verify web-test
